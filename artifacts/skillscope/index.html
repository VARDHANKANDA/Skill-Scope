<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Prevent theme flash: apply stored theme before first paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('skillscope-theme') || 'dark';
          var r = t === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : t;
          document.documentElement.classList.add(r);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>SkillScope</title>
    <meta name="description" content="SkillScope — An AI-powered developer intelligence and analytics platform." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="SkillScope" />
    <meta property="og:description" content="SkillScope — An AI-powered developer intelligence and analytics platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SkillScope" />
    <meta name="twitter:description" content="SkillScope — An AI-powered developer intelligence and analytics platform." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
